<!doctype html>
<html lang="en" class="app-dark">
<head>
  <meta charset="utf-8">
  <title>StarOrigin — Recruitment &amp; Staffing across India, UAE &amp; USA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StarOrigin connects ambitious companies with proven people — from CXO search to volume hiring — across India, the UAE and the US.">
  <meta name="theme-color" content="#060912">
  <link rel="icon" href="https://starorigin.in/wp-content/uploads/2022/03/cropped-favicon-512-270x270.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <!-- Apply the saved theme before first paint (dark is the default). Kept in sync by ThemeService. -->
  <script>
    try {
      if (localStorage.getItem('so-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.classList.remove('app-dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
